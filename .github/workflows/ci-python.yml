name: ci-python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.x"]
        include:
          # Oldest supported Python (macOS's built-in python3 is 3.9). Pinned to
          # 24.04 because setup-python has no 3.9 build for ubuntu-latest (26.04).
          # When 24.04 runners retire, move this job to `container: python:3.9-slim`
          # or install 3.9 with uv.
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python unit + fixture-parity tests
        run: python3 -m unittest discover -s tests/python -v
