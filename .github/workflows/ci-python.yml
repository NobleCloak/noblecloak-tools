name: ci-python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.x"]
        include:
          # Oldest supported Python (macOS's built-in python3 is 3.9).
          - os: ubuntu-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python unit + fixture-parity tests
        run: python3 -m unittest discover -s tests/python -v
